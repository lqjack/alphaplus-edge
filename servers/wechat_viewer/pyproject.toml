[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-viewer"
version = "0.1.0"
description = "WeChat Web Automation Server"
readme = "README.md"
authors = [{name = "DataProAI Team"}]
license = {text = "MIT"}
requires-python = ">=3.12"
_classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
develop = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "ruff>=0.0.200",
]

[project.dependencies]
# Primary Dependencies
mcp = ">=1.2.0"
playwright = ">=1.40.0"
flask = ">=3.0.0"
flask-cors = ">=4.0.0"
pydantic = ">=2.0.0"
httpx = ">=0.28.1"
loguru = ">=0.7.0"
python-dotenv = ">=1.0.1"
nest-asyncio = ">=1.6.0"
yfinance = ">=1.2.1"
psutil = ">=5.9.0"

# OCR Dependencies
Pillow = ">=10.0.0"
pytesseract = ">=0.3.10"

# GUI Automation Dependencies
pyautogui = ">=0.9.54"
pyperclip = ">=1.8.2"

# macOS Specific Dependencies
pyobjc-core = { version = ">=10.0", markers = "sys_platform == 'darwin'" }
pyobjc-framework-Quartz = { version = ">=10.0", markers = "sys_platform == 'darwin'" }
pyobjc-framework-Accessibility = { version = ">=10.0", markers = "sys_platform == 'darwin'" }
pyobjc-framework-Vision = { version = ">=10.0", markers = "sys_platform == 'darwin'" }
[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
features = ["develop"]

[tool.hatch.envs.test]
features = ["develop"]

[tool.hatch.envs.test.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"

[tool.ruff]
line-length = 88
select = ["E", "W", "F", "I", "C", "B", "ANN", "PLC", "PLE", "PLR"]
ignore = ["E501", "W503", "F401"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
combine_as_imports = true
force_single_line = true
line_length = 88
known_third_party = [
    "mcp",
    "playwright",
    "flask",
    "flask_cors",
    "pydantic",
    "httpx",
    "loguru",
    "python_dotenv",
    "nest_asyncio",
    "pytest",
]

[tool.mypy]
python_version = "3.12"
pretty = true
show_column_numbers = true
warn_unreachable = true
exclude = [
    "^.*example.*$",
    "^.*test.*$",
]

[jupyter-notebook]
